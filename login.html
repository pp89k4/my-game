
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NK News | تسجيل الدخول</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080e1b;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 410px;
      background: #111c30;
      padding: 28px;
      border-radius: 18px;
      border: 1px solid #263754;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .subtitle { text-align: center; color: #9eacc2; margin-bottom: 25px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tabs button {
      flex: 1;
      background: #202e46;
      color: white;
      border: 0;
      padding: 12px;
      border-radius: 9px;
      cursor: pointer;
    }
    .tabs button.active { background: #1877f2; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #34445e;
      border-radius: 9px;
      background: #0b1425;
      color: white;
      font-size: 15px;
    }
    .submit {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      margin-top: 14px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #message {
      margin-top: 16px;
      text-align: center;
      line-height: 1.7;
      color: #c8d7ed;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="container">
    <h1>NK News</h1>
    <p class="subtitle">صوت العالم في مكان واحد</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">تسجيل الدخول</button>
      <button id="registerTab" type="button">إنشاء حساب</button>
    </div>

    <form id="authForm">
      <input id="name" class="hidden" type="text"
        placeholder="اسم المستخدم" maxlength="40">
      <input id="email" type="email" placeholder="البريد الإلكتروني" required>
      <input id="password" type="password" placeholder="كلمة المرور"
        minlength="6" required>
      <button class="submit" id="submitBtn" type="submit">تسجيل الدخول</button>
    </form>

    <div id="message" role="status"></div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendEmailVerification,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("authForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    let mode = "login";

    function showMessage(text, color = "#c8d7ed") {
      message.textContent = text;
      message.style.color = color;
    }

    function setMode(newMode) {
      mode = newMode;
      const registering = mode === "register";

      nameInput.classList.toggle("hidden", !registering);
      nameInput.required = registering;
      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);
      submitBtn.textContent = registering ? "إنشاء حساب" : "تسجيل الدخول";
      showMessage("");
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    async function createUserProfile(user, displayName) {
      const profileRef = doc(db, "users", user.uid);
      const profileSnap = await getDoc(profileRef);

      // لا نعيد إنشاء الملف إذا كان موجودًا، حتى لا نمسح حالة التوثيق.
      if (!profileSnap.exists()) {
        await setDoc(profileRef, {
          uid: user.uid,
          displayName: displayName || user.displayName || "مستخدم",
          email: user.email,
          verified: false,
          createdAt: serverTimestamp()
        });
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const displayName = nameInput.value.trim();

      submitBtn.disabled = true;
      showMessage("يرجى الانتظار...");

      try {
        if (mode === "register") {
          if (!displayName) {
            throw new Error("اكتب اسم المستخدم.");
          }

          const result = await createUserWithEmailAndPassword(
            auth, email, password
          );

          await createUserProfile(result.user, displayName);
          await sendEmailVerification(result.user);
          await signOut(auth);

          showMessage(
            "تم إنشاء حسابك! افتح بريدك الإلكتروني واضغط رابط التحقق، ثم سجّل الدخول.",
            "#54d69a"
          );
        } else {
          const result = await signInWithEmailAndPassword(
            auth, email, password
          );

          if (!result.user.emailVerified) {
            await sendEmailVerification(result.user);
            await signOut(auth);

            showMessage(
              "بريدك غير مؤكد. أرسلنا لك رابط تحقق جديدًا.",
              "#ffcc66"
            );
            return;
          }

          await createUserProfile(result.user, result.user.displayName);
          window.location.href = "index.html";
        }
      } catch (error) {
        const errors = {
          "auth/email-already-in-use": "هذا البريد مسجل بالفعل.",
          "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
          "auth/weak-password": "كلمة المرور ضعيفة؛ استخدم 6 أحرف على الأقل.",
          "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
          "auth/too-many-requests": "محاولات كثيرة. حاول لاحقًا.",
          "permission-denied": "تعذر إنشاء ملف المستخدم. راجع قواعد Firestore."
        };

        showMessage(
          errors[error.code] || error.message || "حدث خطأ، حاول مرة أخرى.",
          "#ff7777"
        );
      } finally {
        submitBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user && user.emailVerified) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
  </html>
