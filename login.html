
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | NK News</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Cairo, Arial, sans-serif;
      background: #101f3d;
      color: #17243a;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 50px #0003;
    }

    h1 {
      text-align: center;
      color: #1765c1;
      margin: 0 0 5px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #738097;
      margin: 0 0 25px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: #edf2f8;
      color: #17243a;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .tabs button.active {
      background: #1765c1;
      color: white;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 13px;
      border: 1px solid #dce3ed;
      border-radius: 9px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus { border-color: #1765c1; }

    .main-button {
      width: 100%;
      padding: 13px;
      background: #1765c1;
      color: white;
      border: 0;
      border-radius: 9px;
      font-family: inherit;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .main-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
      color: #53647d;
    }

    .hidden { display: none; }
  </style>
</head>

<body>
  <div class="container">
    <h1>NK News</h1>
    <p class="subtitle">مرحبًا بك في مجتمع الأخبار</p>

    <div class="tabs">
      <button id="loginTab" class="active">تسجيل الدخول</button>
      <button id="registerTab">إنشاء حساب</button>
    </div>

    <form id="authForm">
      <input
        id="name"
        type="text"
        placeholder="الاسم"
        class="hidden"
        autocomplete="name"
      >

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        required
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        required
        minlength="6"
        autocomplete="current-password"
      >

      <button class="main-button" id="submitButton" type="submit">
        تسجيل الدخول
      </button>
    </form>

    <div id="message"></div>
  </div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      sendEmailVerification,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("authForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    let mode = "login";
    let checkingAuth = true;

    function showMessage(text, color = "#53647d") {
      message.textContent = text;
      message.style.color = color;
    }

    function setMode(newMode) {
      mode = newMode;

      const registering = mode === "register";

      nameInput.classList.toggle("hidden", !registering);
      nameInput.required = registering;

      loginTab.classList.toggle("active", !registering);
      registerTab.classList.toggle("active", registering);

      submitButton.textContent = registering
        ? "إنشاء الحساب"
        : "تسجيل الدخول";

      passwordInput.autocomplete = registering
        ? "new-password"
        : "current-password";

      showMessage("");
    }

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));

    // إنشاء الملفات عند تسجيل الدخول ببريد موثّق
    async function createUserProfile(user, displayName) {
      const userRef = doc(db, "users", user.uid);
      const publicRef = doc(db, "publicProfiles", user.uid);

      const [userSnapshot, publicSnapshot] = await Promise.all([
        getDoc(userRef),
        getDoc(publicRef)
      ]);

      let savedName = displayName || user.displayName || "مستخدم";

      if (!userSnapshot.exists()) {
        await setDoc(userRef, {
          uid: user.uid,
          displayName: savedName,
          email: user.email,
          verified: false,
          createdAt: serverTimestamp()
        });
      } else {
        const oldData = userSnapshot.data();
        savedName = oldData.displayName || savedName;
      }

      if (!publicSnapshot.exists()) {
        await setDoc(publicRef, {
          uid: user.uid,
          displayName: savedName,
          verified: false
        });
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const displayName = nameInput.value.trim();

      if (mode === "register" && !displayName) {
        showMessage("اكتب اسمك أولًا.", "#d94343");
        return;
      }

      submitButton.disabled = true;
      showMessage("جارٍ تنفيذ العملية...");

      try {
        if (mode === "register") {
          const result = await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          if (auth.currentUser) {
            await sendEmailVerification(auth.currentUser);
          }

          await signOut(auth);

          showMessage(
            "تم إنشاء حسابك! أرسلنا رابط التحقق إلى بريدك الإلكتروني. افتح الرابط ثم سجّل الدخول.",
            "#168653"
          );

          form.reset();
          setMode("login");

        } else {
          const result = await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          const user = result.user;

          await user.reload();

          if (!user.emailVerified) {
            await sendEmailVerification(user);
            await signOut(auth);

            showMessage(
              "يجب تأكيد بريدك الإلكتروني أولًا. أرسلنا لك رابط التحقق مرة أخرى.",
              "#d18b16"
            );

            return;
          }

          await createUserProfile(user);

          showMessage("تم تسجيل الدخول بنجاح!", "#168653");

          location.href = "index.html";
        }

      } catch (error) {
        console.error(error);

        const errors = {
          "auth/email-already-in-use": "هذا البريد مسجل بالفعل.",
          "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
          "auth/weak-password": "كلمة المرور ضعيفة.",
          "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
          "auth/network-request-failed": "تحقق من اتصال الإنترنت."
        };

        showMessage(
          errors[error.code] || "حدث خطأ: " + error.message,
          "#d94343"
        );

      } finally {
        submitButton.disabled = false;
      }
    });

    onAuthStateChanged(auth, async user => {
      if (checkingAuth) {
        checkingAuth = false;

        if (user && user.emailVerified) {
          location.href = "index.html";
        }
      }
    });
  </script>
</body>
                                                         </html>
